name: Public CI Validation
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - 'docs/**'
      - 'rule.md'
      - 'CHANGELOG.md'
      - 'README.md'
  push:
    branches:
      - develop
      - master
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - 'docs/**'
      - 'rule.md'
      - 'CHANGELOG.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse workflow YAML
        shell: ruby {0}
        run: |
          require "yaml"
          files = Dir[".github/workflows/*.{yml,yaml}"].sort
          abort "No workflow files" if files.empty?
          files.each do |file|
            YAML.parse_file(file)
            puts "YAML syntax OK: #{file}"
          end

  mock-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run standalone mock tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  php-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP source syntax
        run: |
          php -l examples/php/Calculator.php
          php -l tests/php/test_calculator.php
      - name: Run PHP synthetic assertions
        run: php tests/php/test_calculator.php

  javascript-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check examples/js/validation.cjs
          node --check tests/js/test_validation.cjs
      - name: Run JavaScript synthetic assertions
        run: node tests/js/test_validation.cjs
